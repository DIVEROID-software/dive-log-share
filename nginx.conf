server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Nén gzip cho các asset text
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Cache lâu cho asset có hash trong tên (Vite tạo file fingerprint)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: mọi route không khớp file đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
